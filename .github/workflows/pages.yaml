---
# Builds the documentation site (site/) with the backend-less dashboard demo
# (frontend, `--mode demo`) under /demo/, and publishes both to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "frontend/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            site/package-lock.json
      - name: Build the dashboard demo
        working-directory: frontend
        run: |
          npm ci
          npm run build:demo
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          rm -rf public/demo
          cp -R ../frontend/dist-demo public/demo
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
