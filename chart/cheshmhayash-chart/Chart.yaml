apiVersion: v2
name: cheshmhayash-chart
description: NATS administration dashboard served over the NATS protocol itself.
type: application

# Chart version — bump on every chart change (independent of appVersion).
version: 2.2.0

# Application version — matches the cheshmhayash binary release. The
# release.yaml workflow rewrites this to the pushed tag's version.
appVersion: "1.0.1"

# Lower bound for the Kubernetes API. autoscaling/v2 is the strictest
# requirement (GA in 1.23). The chart is tested against the in-support
# minors but doesn't need newer APIs.
kubeVersion: ">=1.23.0-0"

home: https://github.com/1995parham/cheshmhayash
sources:
  - https://github.com/1995parham/cheshmhayash
icon: https://raw.githubusercontent.com/1995parham/cheshmhayash/main/banner.png
keywords:
  - nats
  - jetstream
  - admin
  - dashboard
  - panel
  - monitoring

maintainers:
  - name: Parham Alvani
    url: https://github.com/1995parham
    email: parham.alvani@gmail.com

annotations:
  artifacthub.io/category: monitoring
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/1995parham/cheshmhayash
    - name: nats.io
      url: https://nats.io
  artifacthub.io/changes: |
    - kind: added
      description: "`bot.*` runs the operations bot (`cheshmhayash bot serve`, formerly the natsie chart) as its own single-replica Deployment with its config, NATS contexts, signing key, state PVC, Service, ServiceMonitor, Ingress/HTTPProxy and NetworkPolicy. Off by default."
    - kind: added
      description: "`mcp.allowSampling` registers the subject_sample MCP tool (CHESHMHAYASH_MCP_SAMPLE=1), which returns a few decoded messages of a subject."
    - kind: changed
      description: "One binary with subcommands: the dashboard runs `cheshmhayash serve` and the MCP workload runs `cheshmhayash mcp --http`. Requires an image built from this release or later; the `cheshmhayash-mcp` binary is gone."
    - kind: added
      description: "`components` selects the parts of the dashboard Deployment (`api`, `ui`, `notify`; all by default), so a notifier-only or API-only workload is one value away."
    - kind: changed
      description: "The license is now Apache-2.0."
    - kind: added
      description: "`schemas` mounts protobuf schemas (schemas.toml + descriptor sets) from a ConfigMap or an image into the dashboard and MCP pods and sets CHESHMHAYASH_SCHEMAS, so `cheshmhayash sub/pub/schema` decode protobuf in the pod."
