{{- if .Values.bot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cheshmhayash-chart.bot.fullname" . }}
  labels:
    {{- include "cheshmhayash-chart.bot.labels" . | nindent 4 }}
  {{- with .Values.bot.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.bot.service.type }}
  ports:
    - port: {{ .Values.bot.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cheshmhayash-chart.bot.selectorLabels" . | nindent 4 }}
{{- end }}
