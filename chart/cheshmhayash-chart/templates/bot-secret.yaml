{{- if .Values.bot.enabled }}
{{- if eq (include "cheshmhayash-chart.bot.hasManagedSigningKey" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cheshmhayash-chart.bot.secretName" . }}
  labels:
    {{- include "cheshmhayash-chart.bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  signing_key: {{ .Values.bot.signingKey | quote }}
{{- end }}
{{- if eq (include "cheshmhayash-chart.bot.hasManagedNatsContexts" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cheshmhayash-chart.bot.natsCtxSecretName" . }}
  labels:
    {{- include "cheshmhayash-chart.bot.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range .Values.bot.natsContexts.inline }}
  {{ .name }}.json: {{ .content | quote }}
{{- end }}
{{- end }}
{{- if eq (include "cheshmhayash-chart.bot.hasManagedMattermostToken" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cheshmhayash-chart.bot.mattermostTokenSecretName" . }}
  labels:
    {{- include "cheshmhayash-chart.bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.bot.mattermost.token | quote }}
{{- end }}
{{- end }}
