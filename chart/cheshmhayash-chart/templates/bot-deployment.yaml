{{- if .Values.bot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cheshmhayash-chart.bot.fullname" . }}
  labels:
    {{- include "cheshmhayash-chart.bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bot.replicaCount }}
  revisionHistoryLimit: {{ .Values.bot.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.bot.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cheshmhayash-chart.bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cheshmhayash-chart.bot.selectorLabels" . | nindent 8 }}
        {{- with .Values.bot.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.bot.restartOnConfigChange }}
        checksum/config: {{ include "cheshmhayash-chart.bot.configYaml" . | sha256sum }}
        {{- end }}
        {{- with .Values.bot.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cheshmhayash-chart.bot.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bot.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.bot.initContainers (and .Values.bot.natsContexts.fromEnv.enabled .Values.bot.natsContexts.fromEnv.contexts) }}
      initContainers:
        {{- if and .Values.bot.natsContexts.fromEnv.enabled .Values.bot.natsContexts.fromEnv.contexts }}
        - name: render-nats-contexts
          image: {{ printf "%s:%s" .Values.bot.natsContexts.fromEnv.image.repository .Values.bot.natsContexts.fromEnv.image.tag }}
          imagePullPolicy: {{ .Values.bot.natsContexts.fromEnv.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Make the file world-readable up front. The main container
              # runs as a different uid than busybox's `cat` default
              # (busybox writes mode 0600 in some SCC contexts), so an
              # explicit umask + chmod is the only way to guarantee the
              # nonroot cheshmhayash user can open the file.
              umask 0022
              mkdir -p /shared
              {{- range $i, $c := .Values.bot.natsContexts.fromEnv.contexts }}
              cat > /shared/{{ $c.name }}.json <<EOF
              {
                "url": "{{ $c.url }}",
                "user": "${CTX_{{ $i }}_USER}",
                "password": "${CTX_{{ $i }}_PASSWORD}"
              }
              EOF
              chmod 0644 /shared/{{ $c.name }}.json
              {{- end }}
          env:
            {{- range $i, $c := .Values.bot.natsContexts.fromEnv.contexts }}
            - name: CTX_{{ $i }}_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secret.name }}
                  key: {{ $c.secret.userKey }}
            - name: CTX_{{ $i }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $c.secret.name }}
                  key: {{ $c.secret.passwordKey }}
            {{- end }}
          volumeMounts:
            - name: nats-contexts
              mountPath: /shared
        {{- end }}
        {{- with .Values.bot.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: bot
          image: {{ include "cheshmhayash-chart.bot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - bot
            - serve
            - --ops-config
            - /etc/cheshmhayash/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.bot.service.port }}
              protocol: TCP
          env:
            # natsctx looks up ~/.config/nats/context/<name>.json via
            # os.UserHomeDir(). Two problems with the default home:
            #  - distroless/static-debian12:nonroot leaves HOME unset, so
            #    the lookup falls back to "/" and misses the mount point.
            #  - The image pre-creates /home/nonroot at mode 0700 owned by
            #    uid 65532, which OpenShift's namespace-injected runAsUser
            #    can't traverse.
            # Pin HOME to a path the image does NOT pre-create so the
            # kubelet mount-point creation produces 0755 root:root dirs
            # that any uid can traverse.
            - name: HOME
              value: /home/cheshmhayash
            {{- if or (eq (include "cheshmhayash-chart.bot.hasManagedSigningKey" .) "true") .Values.bot.existingSigningKeySecret.name }}
            - name: CHESHMHAYASH_OPS_BOT__SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.bot.existingSigningKeySecret.name }}
                  name: {{ .Values.bot.existingSigningKeySecret.name }}
                  key: {{ .Values.bot.existingSigningKeySecret.key | default "signing_key" }}
                  {{- else }}
                  name: {{ include "cheshmhayash-chart.bot.secretName" . }}
                  key: signing_key
                  {{- end }}
            {{- end }}
            {{- if .Values.bot.notifySecret }}
            - name: CHESHMHAYASH_OPS_BOT__NOTIFY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bot.notifySecret }}
                  key: urls
            {{- end }}
            {{- if .Values.bot.mattermost.enabled }}
            - name: CHESHMHAYASH_OPS_BOT__MATTERMOST__TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.bot.mattermost.existingTokenSecret.name }}
                  name: {{ .Values.bot.mattermost.existingTokenSecret.name }}
                  key: {{ .Values.bot.mattermost.existingTokenSecret.key | default "token" }}
                  {{- else }}
                  name: {{ include "cheshmhayash-chart.bot.mattermostTokenSecretName" . }}
                  key: token
                  {{- end }}
            {{- end }}
            {{- with .Values.bot.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.bot.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.bot.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.bot.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.bot.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.bot.probes.startup.timeoutSeconds }}
          {{- end }}
          {{- if .Values.bot.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.bot.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.bot.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.bot.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.bot.probes.readiness.successThreshold }}
          {{- end }}
          {{- if .Values.bot.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.bot.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.bot.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.bot.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/cheshmhayash/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if or .Values.bot.natsContexts.existingSecret (eq (include "cheshmhayash-chart.bot.hasManagedNatsContexts" .) "true") }}
            - name: nats-contexts
              mountPath: /home/cheshmhayash/.config/nats/context
              readOnly: true
            {{- else if and .Values.bot.natsContexts.fromEnv.enabled .Values.bot.natsContexts.fromEnv.contexts }}
            - name: nats-contexts
              mountPath: /home/cheshmhayash/.config/nats/context
              readOnly: true
            {{- end }}
            - name: state
              mountPath: /var/lib/cheshmhayash
            # readOnlyRootFilesystem is true, so anything the binary writes
            # outside of /var/lib/cheshmhayash has to land on an emptyDir.
            - name: tmp
              mountPath: /tmp
            {{- with .Values.bot.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.bot.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "cheshmhayash-chart.bot.configMapName" . }}
        {{- if or .Values.bot.natsContexts.existingSecret (eq (include "cheshmhayash-chart.bot.hasManagedNatsContexts" .) "true") }}
        - name: nats-contexts
          secret:
            secretName: {{ include "cheshmhayash-chart.bot.natsCtxSecretEffective" . }}
            defaultMode: 0400
        {{- else if and .Values.bot.natsContexts.fromEnv.enabled .Values.bot.natsContexts.fromEnv.contexts }}
        - name: nats-contexts
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
        - name: state
          {{- if .Values.bot.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cheshmhayash-chart.bot.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- with .Values.bot.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.bot.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bot.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bot.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
